<!DOCTYPE html>
<html>

<head>
    <title>Author Books</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        h1{
            text-align: center;
            color: #333333;
            margin-bottom: 40px;
        }

        table{
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th{
            background-color: #4CAF50;
            color: white;
            padding: 15px;
        }

        td{
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #dddddd;
        }

        tr:hover{
            background-color: #f1f1f1;
        }

        button{
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover{
            background-color: #45a049;
        }

        .back-link{
            display: block;
            text-align: center;
            margin-top: 30px;
            text-decoration: none;
            color: #4CAF50;
            font-size: 18px;
        }

        .back-link:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <h1>Books by {{ author_name }}</h1>

    <table>

        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Category</th>
            <th>Rating</th>
            <th>Details</th>
        </tr>

        {% for book in books %}

        <tr>

            <td>{{ book[1] }}</td>
            <td>{{ book[2] }}</td>
            <td>{{ book[4] }}</td>
            <td>{{ book[6] }}</td>

            <td>

                <form action="/books/details" method="POST">

                    <input type="hidden"
                           name="book_id"
                           value="{{ book[0] }}">

                    <button type="submit">
                        View Details
                    </button>

                </form>

            </td>

        </tr>

        {% endfor %}

    </table>

    <a href="/books" class="back-link">
        Back to Search
    </a>

</body>

</html>
