<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Library - Search</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        
        .search-container {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 25px;
        }

        .search-container h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 25px;
        }

        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            border-color: #3498db;
        }

        .search-box button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .search-box button:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        
        .recommended-trigger {
            display: inline-block;
            width: 100%;
            text-decoration: none;
            margin-top: 5px;
        }

        .recommended-btn {
            width: 100%;
            background-color: #9b59b6; /* צבע סגול אלגנטי להמלצות */
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-sizing: border-box;
        }

        .recommended-btn:hover {
            background-color: #8e44ad;
            transform: translateY(-1px);
        }

        
        .error-message {
            background-color: #fce4e4;
            border-left: 5px solid #c00a0a;
            color: #c00a0a;
            padding: 12px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
        }

        
        .recommendations-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        .recommendations-container h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 20px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        
        .book-list {
            list-style: none; 
            padding: 0;
            margin: 0;
        }

        .book-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #f1f2f6;
            transition: background-color 0.2s ease;
        }

        .book-item:last-child {
            border-bottom: none;
        }

        .book-item:hover {
            background-color: #f8fafc;
        }

        .book-title {
            font-size: 15px;
            color: #2c3e50;
        }

        .book-rating {
            background-color: #f1c40f; 
            color: #2c3e50;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }

        
        .back-home {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-home:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="search-container">
        <h1>Digital Library - Search</h1>
        
        <form action="/books/search" method="post" class="search-box">
            <input type="text" name="book_name" placeholder="Enter book name..." required>
            <button type="submit">Search</button>
        </form>

        <a href="/books/recommended" class="recommended-trigger">
            <button type="button" class="recommended-btn"> View Recommended Books</button>
        </a>

        {% if error %}
            <div class="error-message"> {{ error }}</div>
        {% endif %}
    </div>

    {% if recommended_books %}
    <div class="recommendations-container">
        <h2>Top 10 Highest Rated Books:</h2>
        <ul class="book-list">
            {% for book in recommended_books %}
                <li class="book-item">
                    <span class="book-title"><strong>{{ book[0] }}</strong></span>
                    <span class="book-rating"> {{ book[1] }} / 5</span>
                </li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <a href="/" class="back-home">← Back to Home Page</a>

</body>
</html>
