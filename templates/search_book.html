<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Library - Search</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/search.css">
</head>
<body>

    <div class="search-container">
        <h1>Digital Library - Search</h1>
        
        <form action="/books/search" method="post" class="search-box">
            <input type="text" name="book_name" placeholder="Enter book name..." >
            <button type="submit">Search</button>
        </form>

        <form action="/books/search-author" method="post" class="search-box">
            <input type="text" name="author_name" placeholder="Enter author name..." >
            <button type="submit">Search</button>
        </form>

        <a href="/books/recommended" class="recommended-trigger">
            <button type="button" class="recommended-btn"> View Recommended Books</button>
        </a>

        {% if error %}
            <div class="error-message"> {{ error }}</div>
        {% endif %}
    </div>

    {% if recommended_books %}
    <div class="recommendations-container">
        <h2>Top 10 Highest Rated Books:</h2>
        <ul class="book-list">
            {% for book in recommended_books %}
                <li class="book-item">
                    <span class="book-title"><strong>{{ book[0] }}</strong></span>
                    <span class="book-rating"> {{ book[1] }} / 5</span>
                </li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <a href="/" class="back-home">← Back to Home Page</a>

</body>
</html>
