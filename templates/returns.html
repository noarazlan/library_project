<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Library - Return Book</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        
        .confirm-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .confirm-card h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 26px;
            margin-bottom: 15px;
        }

        .confirm-card p {
            color: #7f8c8d;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        
        .buttons-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
        }

        
        .btn {
            flex: 1;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-yes {
            background-color: #2ecc71;
            color: white;
        }

        .btn-yes:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        
        .btn-no {
            background-color: #95a5a6;
            color: white;
            display: inline-block;
        }

        .btn-no:hover {
            background-color: #7f8c8d;
            transform: translateY(-2px);
        }

        
        .confirm-form {
            flex: 1;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <div class="confirm-card">
        <h1>↩️ Return Book</h1>
        <p>Are you sure you would like to return the book <br><strong>"{{ book_title }}"</strong>?</p>
        
        <div class="buttons-group">
            <form action="/loans/return" method="POST" class="confirm-form">
                <input type="hidden" name="loan_id" value="{{ loan_id }}">
                <button type="submit" class="btn btn-yes">Yes, Return</button>
            </form>
            
            <a href="/profile" class="btn btn-no">No, Go Back</a>
        </div>
    </div>

</body>
</html>
