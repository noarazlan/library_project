<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Library - Book Details</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        
        .book-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 550px;
            width: 100%;
            box-sizing: border-box;
        }

        .book-card h1 {
            margin-top: 0;
            color: #2ecc71;
            font-size: 26px;
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 15px;
        }

       
        .info-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid #f1f2f6;
            font-size: 16px;
        }

        .info-row:last-of-type {
            border-bottom: none;
            margin-bottom: 20px;
        }

        .info-label {
            font-weight: bold;
            color: #34495e;
            width: 110px; 
            flex-shrink: 0;
        }

        .info-value {
            color: #57606f;
            line-height: 1.5;
        }

        
        .id-value {
            color: #7f8c8d;
            font-weight: 600;
        }

        .price-value {
            color: #2e7d32;
            font-weight: bold;
        }

        .rating-badge {
            background-color: #f1c40f;
            color: #2c3e50;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }

       
        .actions-container {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        
        .purchase-btn {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .purchase-btn:hover {
            background-color: #27ae60;
            transform: translateY(-2px);
        }

        .borrowed-btn {
            width: 100%;
            background-color: #b2bec3;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: not-allowed;
            margin-bottom: 4px;
        }

        .waitlist-btn {
            width: 100%;
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .waitlist-btn:hover {
            background-color: #d35400;
            transform: translateY(-2px);
        }

        
        .success-box {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
            color: #0d47a1;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
            font-size: 15px;
            font-weight: 500;
            line-height: 1.4;
            text-align: left;
        }

      
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #2c3e50;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="book-card">
        <h1>📖 Book Found!</h1>
        
        <div class="info-row">
            <span class="info-label">Book ID:</span>
            <span class="info-value id-value">#{{ book_id }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Title:</span>
            <span class="info-value"><strong>{{ title }}</strong></span>
        </div>
        <div class="info-row">
            <span class="info-label">Author:</span>
            <span class="info-value">{{ author }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Category:</span>
            <span class="info-value">{{ category }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Summary:</span>
            <span class="info-value">{{ summary }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Price:</span>
            <span class="info-value price-value">{{ price }}$</span>
        </div>
        <div class="info-row">
            <span class="info-label">Rating:</span>
            <span class="info-value">
                <span class="rating-badge">⭐ {{ rating }} / 5</span>
            </span>
        </div>

        <div class="actions-container">
            {% if is_available %}
                <form action="/loans/borrow" method="POST">
                    <input type="hidden" name="book_id" value="{{ book_id }}">
                    <button type="submit" class="purchase-btn">Purchase Book</button>
                </form>
            {% else %}
                <button type="button" class="borrowed-btn" disabled>🔒 Currently Borrowed</button>
                
                <form action="/books/waitlist" method="POST">
                    <input type="hidden" name="book_id" value="{{ book_id }}">
                    <button type="submit" class="waitlist-btn">⏳ Join Waitlist</button>
                </form>
            {% endif %}
        </div>

        {% if message %}
            <div class="success-box">
                ℹ️ {{ message }}
            </div>
        {% endif %}

        <a href="http://127.0.0.1:8000/books" class="back-link">← Back to Search</a>
    </div>

</body>
</html>
