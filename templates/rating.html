<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Library - Rate Book</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        .rate-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        .rate-card h1 {
            margin-top: 0;
            color: #f1c40f; 
            font-size: 26px;
            margin-bottom: 10px;
        }

        .rate-card p {
            color: #7f8c8d;
            font-size: 15px;
            margin-bottom: 25px;
        }

       
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
            font-size: 14px;
        }

        .rating-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8f9fa;
            color: #2c3e50;
            outline: none;
        }

        .review-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8f9fa;
            color: #2c3e50;
            resize: none;
            height: 100px;
            box-sizing: border-box;
            outline: none;
        }

        .review-textarea:focus, .rating-select:focus {
            border-color: #3498db;
        }

        
        .submit-btn {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="rate-card">
        <h1>⭐ Share Your Review</h1>
        <p>Thank you for returning <strong>"{{ book_title }}"</strong>! Please take a moment to rate your experience.</p>
        
        <form action="/loans/submit-review" method="POST">
            <input type="hidden" name="loan_id" value="{{ loan_id }}">
            <input type="hidden" name="book_id" value="{{ book_id }}">

            <div class="form-group">
                <label for="rating_value">Your Rating:</label>
                <select name="rating_value" id="rating_value" class="rating-select" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5 - Amazing)</option>
                    <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                    <option value="3">⭐⭐⭐ (3 - Okay)</option>
                    <option value="2">⭐⭐ (2 - Bad)</option>
                    <option value="1">⭐ (1 - Terrible)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="review_text">Write a Review (Optional):</label>
                <textarea name="review_text" id="review_text" class="review-textarea" placeholder="What did you think of the book?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit & Finish</button>
        </form>
    </div>

</body>
</html>
