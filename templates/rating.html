<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Digital Library - Rate Book</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/forms.css">
    <link rel="stylesheet" href="/static/css/rating.css">
</head>
<body>

    <div class="rate-card">
        <h1>⭐ Share Your Review</h1>
        <p>Thank you for returning <strong>"{{ book_title }}"</strong>! Please take a moment to rate your experience.</p>
        
        <form action="/loans/submit-review" method="POST">
            <input type="hidden" name="loan_id" value="{{ loan_id }}">
            <input type="hidden" name="book_id" value="{{ book_id }}">

            <div class="form-group">
                <label for="rating_value">Your Rating:</label>
                <select name="rating_value" id="rating_value" class="rating-select" required>
                    <option value="5">⭐⭐⭐⭐⭐ (5 - Amazing)</option>
                    <option value="4">⭐⭐⭐⭐ (4 - Very Good)</option>
                    <option value="3">⭐⭐⭐ (3 - Okay)</option>
                    <option value="2">⭐⭐ (2 - Bad)</option>
                    <option value="1">⭐ (1 - Terrible)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="review_text">Write a Review (Optional):</label>
                <textarea name="review_text" id="review_text" class="review-textarea" placeholder="What did you think of the book?"></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit & Finish</button>
        </form>
    </div>

</body>
</html>
